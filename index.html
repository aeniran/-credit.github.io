<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XGrow - Scan. Fix. Grow.</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #1a1a1a;
      --border: #2a2a2a;
      --purple: #8b5cf6;
      --cyan: #06b6d4;
      --text: #f5f5f5;
      --muted: #a3a3a3;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #121212, var(--bg) 40%);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 860px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4.5vw, 3rem);
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, var(--purple), var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      margin-top: 8px;
      color: var(--muted);
      font-size: 1rem;
    }

    .input-wrap {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    input {
      width: min(100%, 460px);
      background: #111;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 1rem;
      padding: 14px 16px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.2);
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 0.98rem;
      font-weight: 600;
      color: white;
      background: linear-gradient(90deg, var(--purple), var(--cyan));
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 20px rgba(6, 182, 212, 0.2);
    }

    button:hover {
      transform: translateY(-1px) scale(1.01);
      filter: brightness(1.07);
      box-shadow: 0 10px 24px rgba(139, 92, 246, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      cursor: not-allowed;
      filter: grayscale(0.1) brightness(0.8);
      transform: none;
      box-shadow: none;
    }

    .error {
      text-align: center;
      color: var(--error);
      font-size: 0.95rem;
      min-height: 20px;
      margin-bottom: 8px;
    }

    .loading {
      text-align: center;
      color: var(--muted);
      min-height: 22px;
      margin-top: 10px;
      font-size: 0.98rem;
    }

    .result {
      display: none;
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .result.show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .score-box {
      text-align: center;
      margin-bottom: 20px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #141414;
    }

    .score-title {
      font-size: clamp(1.3rem, 3vw, 1.8rem);
      font-weight: 700;
    }

    .username-pill {
      display: inline-block;
      margin-top: 8px;
      color: var(--cyan);
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .section {
      background: #141414;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .section h3 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 1rem;
      color: #ddd;
    }

    ul, .metrics {
      margin: 0;
      padding-left: 18px;
      color: #e4e4e4;
    }

    .metrics {
      list-style: none;
      padding-left: 0;
    }

    .metrics li {
      padding: 4px 0;
      border-bottom: 1px dashed #262626;
    }

    .metrics li:last-child {
      border-bottom: 0;
    }

    .share-row {
      margin-top: 16px;
      text-align: center;
    }

    .share-row button {
      background: #151515;
      border: 1px solid var(--border);
      box-shadow: none;
    }

    .share-status {
      color: var(--muted);
      min-height: 20px;
      margin-top: 8px;
      font-size: 0.92rem;
    }

    @media (max-width: 760px) {
      .card {
        padding: 18px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .input-wrap {
        flex-direction: column;
      }

      input,
      .input-wrap button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="card">
      <header>
        <h1>XGrow</h1>
        <p class="tagline">Scan. Fix. Grow.</p>
      </header>

      <section>
        <div class="input-wrap">
          <input id="username" type="text" placeholder="Enter X username (e.g. @elonmusk)" autocomplete="off" />
          <button id="scanBtn">Scan Profile 🔍</button>
        </div>
        <p class="error" id="error"></p>
        <p class="loading" id="loading"></p>
      </section>

      <section class="result" id="result">
        <div class="score-box">
          <div class="score-title" id="scoreText">Your XGrow Score: 0/100</div>
          <span class="username-pill" id="userTag"></span>
        </div>

        <div class="grid">
          <div class="section">
            <h3>Profile Health</h3>
            <ul class="metrics" id="profileHealth"></ul>
          </div>
          <div class="section">
            <h3>Content Analysis</h3>
            <ul class="metrics" id="contentAnalysis"></ul>
          </div>
          <div class="section">
            <h3>What's Good</h3>
            <ul id="goodList"></ul>
          </div>
          <div class="section">
            <h3>What's Bad</h3>
            <ul id="badList"></ul>
          </div>
          <div class="section" style="grid-column: 1 / -1;">
            <h3>Growth Tips</h3>
            <ul id="tipsList"></ul>
          </div>
        </div>

        <div class="share-row">
          <button id="shareBtn" type="button">Share</button>
          <p class="share-status" id="shareStatus"></p>
        </div>
      </section>
    </div>
  </main>

  <script>
    const usernameInput = document.getElementById('username');
    const scanBtn = document.getElementById('scanBtn');
    const loadingEl = document.getElementById('loading');
    const resultEl = document.getElementById('result');
    const errorEl = document.getElementById('error');
    const scoreTextEl = document.getElementById('scoreText');
    const userTagEl = document.getElementById('userTag');

    const profileHealthEl = document.getElementById('profileHealth');
    const contentAnalysisEl = document.getElementById('contentAnalysis');
    const goodListEl = document.getElementById('goodList');
    const badListEl = document.getElementById('badList');
    const tipsListEl = document.getElementById('tipsList');
    const shareBtn = document.getElementById('shareBtn');
    const shareStatusEl = document.getElementById('shareStatus');

    let loadingInterval = null;
    let scanTimeout = null;
    let finalScore = 0;

    const loadingSteps = [
      'Scanning your profile...',
      'Analyzing your content...',
      'Generating growth tips...'
    ];

    const postingFrequencies = [
      'Low: 1-2 posts per week',
      'Moderate: 3-5 posts per week',
      'Strong: Daily posting pattern',
      'Inconsistent: random bursts'
    ];

    const contentTypes = ['threads', 'memes', 'videos'];

    const goodPool = [
      'Your niche is clearly identifiable.',
      'Tone is engaging and easy to follow.',
      'Posts include solid value for followers.',
      'Profile handle is memorable.',
      'Recent content shows strong momentum.'
    ];

    const badPool = [
      'Bio could explain your value in one clear line.',
      'Posting schedule appears inconsistent.',
      'Calls-to-action are often missing.',
      'Visual branding is not fully polished.',
      'Some posts are too text-heavy for quick scrolls.'
    ];

    const tipsPool = [
      'Optimize your bio for clarity.',
      'Post more consistently.',
      'Use hooks in your tweets.',
      'Turn high-performing posts into thread series.',
      'Reply to larger creators daily for visibility.',
      'Add stronger CTAs to boost replies and reposts.'
    ];

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pickRandomItems(array, count) {
      const shuffled = [...array].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, count);
    }

    function renderList(el, items) {
      el.innerHTML = '';
      items.forEach((item) => {
        const li = document.createElement('li');
        li.textContent = item;
        el.appendChild(li);
      });
    }

    function sanitizeUsername(value) {
      return value.trim().replace(/^@+/, '').replace(/\s+/g, '');
    }

    function startLoading() {
      let i = 0;
      loadingEl.textContent = loadingSteps[i];
      loadingInterval = setInterval(() => {
        i = (i + 1) % loadingSteps.length;
        loadingEl.textContent = loadingSteps[i];
      }, 1000);
    }

    function stopLoading() {
      clearInterval(loadingInterval);
      loadingInterval = null;
      clearTimeout(scanTimeout);
      scanTimeout = null;
      loadingEl.textContent = '';
      scanBtn.disabled = false;
      scanBtn.textContent = 'Scan Profile 🔍';
    }

    function animateScore(target) {
      let current = 0;
      const duration = 1400;
      const interval = 25;
      const increment = Math.max(1, Math.ceil(target / (duration / interval)));

      const timer = setInterval(() => {
        current += increment;
        if (current >= target) {
          current = target;
          clearInterval(timer);
        }
        scoreTextEl.textContent = `Your XGrow Score: ${current}/100`;
      }, interval);
    }

    function generateAndRenderReport(username) {
      finalScore = randomInt(50, 95);
      userTagEl.textContent = `@${username}`;

      const profileHealthItems = [
        `Bio score: ${randomInt(5, 10)}/10`,
        `Profile picture score: ${randomInt(5, 10)}/10`,
        `Banner score: ${randomInt(5, 10)}/10`,
        `Username score: ${randomInt(5, 10)}/10`,
        `Link score: ${randomInt(5, 10)}/10`
      ];

      const contentItems = [
        `Posting frequency: ${postingFrequencies[randomInt(0, postingFrequencies.length - 1)]}`,
        `Best content type: ${contentTypes[randomInt(0, contentTypes.length - 1)]}`,
        `Engagement: ${randomInt(2, 18)}%`
      ];

      renderList(profileHealthEl, profileHealthItems);
      renderList(contentAnalysisEl, contentItems);
      renderList(goodListEl, pickRandomItems(goodPool, 3));
      renderList(badListEl, pickRandomItems(badPool, 3));
      renderList(tipsListEl, pickRandomItems(tipsPool, randomInt(3, 5)));

      resultEl.style.display = 'block';
      requestAnimationFrame(() => resultEl.classList.add('show'));
      animateScore(finalScore);
    }

    scanBtn.addEventListener('click', () => {
      const cleanUsername = sanitizeUsername(usernameInput.value);
      usernameInput.value = cleanUsername;
      shareStatusEl.textContent = '';

      if (!cleanUsername) {
        errorEl.textContent = 'Enter a username';
        stopLoading();
        return;
      }

      errorEl.textContent = '';
      resultEl.classList.remove('show');
      resultEl.style.display = 'none';
      scoreTextEl.textContent = 'Your XGrow Score: 0/100';
      scanBtn.disabled = true;
      scanBtn.textContent = 'Scanning...';

      startLoading();

      scanTimeout = setTimeout(() => {
        stopLoading();
        generateAndRenderReport(cleanUsername);
      }, randomInt(3000, 4000));
    });

    usernameInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        scanBtn.click();
      }
    });

    shareBtn.addEventListener('click', async () => {
      if (!finalScore) {
        shareStatusEl.textContent = 'Run a scan first to share your score.';
        return;
      }

      const text = `I just got ${finalScore}/100 on XGrow 🚀`;

      try {
        await navigator.clipboard.writeText(text);
        shareStatusEl.textContent = 'Copied! Paste it anywhere.';
      } catch (error) {
        shareStatusEl.textContent = text;
      }
    });
  </script>
</body>
</html>
